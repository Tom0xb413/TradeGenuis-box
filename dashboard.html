<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="TradeGenuis 箱体突破：四条件全市场自动扫描，达标标的实时呈现。" />
  <title>TradeGenuis · 箱体突破</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231C223A'/%3E%3Crect x='14' y='26' width='28' height='24' rx='3' fill='none' stroke='%239BD597' stroke-width='4'/%3E%3Cpath d='M38 18 L50 18 L50 30 M50 18 L38 30' stroke='%239BD597' stroke-width='4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <style>
    @font-face { font-family: "Outfit"; font-style: normal; font-weight: 400 700; font-display: swap;
      src: url("static/fonts/outfit-latin.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+25A0-25FF, U+FFFD; }
    @font-face { font-family: "Outfit"; font-style: normal; font-weight: 400 700; font-display: swap;
      src: url("static/fonts/outfit-latin-ext.woff2") format("woff2"); unicode-range: U+0100-024F, U+0259, U+1E00-1EFF, U+2020, U+20A0-20AB, U+20AD-20CF, U+2113, U+2C60-2C7F, U+A720-A7FF; }
    @font-face { font-family: "IBM Plex Mono"; font-style: normal; font-weight: 400; font-display: swap;
      src: url("static/fonts/ibmplexmono-400-latin.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+25A0-25FF, U+FEFF, U+FFFD; }
    @font-face { font-family: "IBM Plex Mono"; font-style: normal; font-weight: 400; font-display: swap;
      src: url("static/fonts/ibmplexmono-400-latin-ext.woff2") format("woff2"); unicode-range: U+0100-024F, U+0259, U+1E00-1EFF, U+2020, U+20A0-20AB, U+20AD-20CF, U+2113, U+2C60-2C7F, U+A720-A7FF; }
    @font-face { font-family: "IBM Plex Mono"; font-style: normal; font-weight: 500; font-display: swap;
      src: url("static/fonts/ibmplexmono-500-latin.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+25A0-25FF, U+FEFF, U+FFFD; }
    @font-face { font-family: "IBM Plex Mono"; font-style: normal; font-weight: 700; font-display: swap;
      src: url("static/fonts/ibmplexmono-700-latin.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+25A0-25FF, U+25A0-25FF, U+FEFF, U+FFFD; }

    /* TradeGenuis 深色主题（对齐 dark.css 定稿） */
    :root {
      --bg: #1C223A;
      --card: rgba(229, 212, 182, 0.045);
      --card-border: rgba(229, 212, 182, 0.13);
      --ink: #E5D4B6;
      --ink-dim: rgba(229, 212, 182, 0.68);
      --ink-faint: rgba(229, 212, 182, 0.44);
      --line: rgba(229, 212, 182, 0.12);
      --chip: rgba(229, 212, 182, 0.10);
      --hover: rgba(229, 212, 182, 0.06);
      --mint: #8FC98B;
      --up: #9BD597;
      --coral: #E2604F;
      --down: #F07A63;
      --orange: #F44E1C;
      --sand-card: #E5D4B6;
      --sand-ink: #1C223A;
      --pop: #232A48;
      --num: "Outfit", sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
      --sans: "Noto Sans SC", -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --r: 18px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 13px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    ::selection { background: rgba(143,201,139,.3); }
    :focus-visible { outline: 2px solid var(--ink-faint); outline-offset: 2px; border-radius: 6px; }
    .num { font-family: var(--num); font-variant-numeric: tabular-nums; }
    .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
    .up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--ink-faint); }

    /* 全宽自适应：无两侧大量留白 */
    .page { width: 100%; max-width: none; margin: 0 auto; padding: 12px 14px 30px; display: flex; flex-direction: column; gap: 10px; }

    /* ================= banner（品牌 pill 风格） ================= */
    .banner {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap; flex: 0 0 auto;
      padding: 8px 10px; background: var(--card); border: 1px solid var(--card-border); border-radius: var(--r);
    }
    .wordmark { font-family: var(--num); font-weight: 700; font-size: 16px; white-space: nowrap; }
    .brand { display: flex; align-items: baseline; gap: 8px; }
    .brand .b-sub { font-size: 12px; color: var(--ink-faint); }
    .pill {
      display: flex; align-items: center; gap: 7px;
      background: var(--card); border: 1px solid var(--card-border);
      border-radius: 999px; padding: 5px 13px;
      font-size: 12px; color: var(--ink-dim); white-space: nowrap;
    }
    .pill b { font-family: var(--num); font-weight: 600; color: var(--ink); }
    .pill .k { color: var(--ink-faint); }
    .autodrop { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
    .autodrop input { accent-color: var(--mint); width: 14px; height: 14px; cursor: pointer; }
    .mode-tag { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); }
    #hotTopics { display: inline-flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-left: auto; font-size: 11.5px; color: var(--ink-dim); }
    .hot-chip { font-family: var(--mono); font-size: 11px; color: var(--ink-dim); background: var(--chip); border: 1px solid var(--card-border); border-radius: 999px; padding: 2px 9px; white-space: nowrap; cursor: pointer; transition: color .15s, border-color .15s, background .15s; }
    .hot-chip:hover { color: var(--ink); border-color: var(--ink-faint); }
    .hot-chip.sel { color: var(--mint-ink); background: var(--up); border-color: var(--up); font-weight: 600; }
    .hot-chip .h-chg { font-size: 10px; }
    .banner-input {
      border: 1px solid var(--card-border); border-radius: 999px; background: var(--chip);
      padding: 5px 12px; font-size: 12px; font-family: var(--mono); color: var(--ink);
      width: 128px; transition: border-color .2s; outline: none;
    }
    .banner-input:focus { border-color: var(--mint); }
    .mini-save {
      border: 1px solid var(--card-border); border-radius: 999px; background: transparent;
      color: var(--ink-dim); font-size: 12px; padding: 5px 14px; cursor: pointer;
      transition: color .2s, background .2s, transform .15s;
    }
    .mini-save:hover { color: var(--ink); background: var(--hover); }
    .mini-save:active { transform: scale(.97); }
    .grow { flex: 1; }
    .tabs { display: flex; gap: 4px; background: var(--chip); border-radius: 999px; padding: 3px; }
    .tab { border: none; background: transparent; color: var(--ink-dim); font-size: 12px; font-weight: 500; padding: 5px 14px; border-radius: 999px; cursor: pointer; transition: color .2s, background .2s; }
    .tab.on { background: rgba(229,212,182,.16); color: var(--ink); }
    .tab:disabled { opacity: .42; cursor: not-allowed; }
    .box-mode {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--chip); border: 1px solid var(--card-border);
      border-radius: 999px; padding: 3px 4px 3px 12px;
    }
    .box-mode .k { font-size: 11px; color: var(--ink-faint); white-space: nowrap; }
    .box-mode .tabs { background: transparent; padding: 0; }
    .box-mode .tab { padding: 5px 11px; }
    .box-mode .tab.on { background: rgba(155,213,151,.2); color: var(--up); }
    .box-mode.dimmed { opacity: .38; pointer-events: none; }
    .box-mode.dimmed .tab { cursor: not-allowed; }
    .flag-badge { display: inline-block; margin-left: 6px; padding: 0 7px; border-radius: 999px; font-size: 10.5px; font-weight: 600; vertical-align: 1px; border: 1px solid currentColor; }
    .flag-badge.flag-handle { color: #E8C48A; background: rgba(232,196,138,.16); }
    .flag-badge.flag-buy { color: #1C223A; background: var(--up); }
    .flag-badge.tl-sup { color: var(--down); background: rgba(240,122,99,.16); }
    .flag-badge.tl-res { color: #1C223A; background: var(--up); }
    .asset-badge { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 999px; font-size: 10px; font-weight: 600; vertical-align: 1px; border: 1px solid currentColor; }
    .asset-badge.crypto { color: #8FC98B; background: rgba(143,201,139,.14); }
    .asset-badge.gold { color: #E8C48A; background: rgba(232,196,138,.16); }
    .asset-badge.us_index { color: #9BB7E8; background: rgba(155,183,232,.16); }
    .asset-badge.us_stock { color: var(--ink-dim); background: rgba(229,212,182,.10); }
    .asset-badge.tokenized { letter-spacing: 0; }
    .token-note { font-size: 10.5px; color: var(--ink-faint); margin-left: 6px; }
    .pill-edit { cursor: pointer; }
    .pill-edit:hover { border-color: var(--mint); color: var(--ink); }
    .interval-note { font-size: 10.5px; color: var(--ink-faint); margin-left: 6px; }
    .act { border: none; border-radius: 999px; font-size: 13px; font-weight: 600; letter-spacing: .08em; padding: 8px 20px; cursor: pointer; transition: filter .2s, transform .1s; color: var(--ink); }
    .act:active { transform: translateY(1px); }
    .act:disabled { opacity: .5; cursor: not-allowed; }
    .act.go { background: var(--orange); color: #fff; }
    .act.go:hover { filter: brightness(1.08); }
    .act.ghost { background: transparent; border: 1px solid var(--card-border); color: var(--ink-dim); font-size: 12px; letter-spacing: .04em; padding: 8px 14px; }
    .act.ghost:hover { color: var(--ink); background: var(--hover); }
    .cache-hint { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); }

    /* 全员共享扫描进度（服务端 STATE.scan_progress，各浏览器轮询同一份） */
    .scan-progress {
      background: var(--card); border: 1px solid var(--card-border);
      border-radius: var(--r); padding: 10px 14px 12px;
    }
    .scan-progress[hidden] { display: none !important; }
    .scan-progress-row {
      display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px;
    }
    .scan-progress-title { font-size: 13px; font-weight: 600; }
    .scan-progress-row .num { color: var(--up); font-weight: 700; font-size: 16px; margin-left: auto; }
    .scan-progress-row .mono { font-size: 11px; color: var(--ink-faint); }
    .scan-progress-track {
      height: 6px; border-radius: 999px; background: var(--chip); overflow: hidden;
    }
    .scan-progress-fill {
      height: 100%; width: 0%; border-radius: 999px; background: var(--up);
      transition: width .35s ease;
    }
    .scan-progress.indeterminate .scan-progress-fill {
      width: 32% !important; transition: none;
      animation: scan-indet 1.2s ease-in-out infinite;
    }
    @keyframes scan-indet {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(380%); }
    }
    .scan-progress-msg { margin-top: 6px; font-size: 12px; color: var(--ink-dim); }

    /* ================= 内容区 ================= */
    .card { background: var(--card); border: 1px solid var(--card-border); border-radius: var(--r); padding: 14px 16px; }
    .sec-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
    .sec-head h3 { font-size: 14px; font-weight: 700; }
    .plan-count { font-family: var(--num); font-size: 12px; color: var(--up); background: rgba(155,213,151,.12); border-radius: 999px; padding: 1px 9px; }

    /* 达标卡片 */
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 10px; }
    .sig { background: var(--card); border: 1px solid var(--card-border); border-radius: var(--r); padding: 12px 14px 10px; animation: rise .45s cubic-bezier(.2,.7,.3,1) both; }
    .sig.q { border-color: rgba(155,213,151,.5); box-shadow: 0 0 0 1px rgba(155,213,151,.2); }
    .q-badge { display: inline-block; margin-left: 7px; padding: 0 7px; border-radius: 999px; font-family: var(--num); font-size: 11px; font-weight: 600; color: var(--mint-ink); background: var(--up); vertical-align: 1px; }
    .edge-badge { display: inline-block; margin-left: 6px; padding: 0 7px; border-radius: 999px; font-size: 10.5px; font-weight: 600; vertical-align: 1px; border: 1px solid currentColor; }
    .edge-badge.edge-test { color: var(--ink); background: rgba(229,212,182,.16); }
    .edge-badge.edge-cand { color: #E8C48A; background: rgba(232,196,138,.16); }
    .edge-badge.edge-bo { color: #1C223A; background: var(--up); }
    .edge-badge.edge-fail { color: var(--down); background: rgba(240,122,99,.16); }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .sig-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .sig .nm { font-size: 14px; font-weight: 700; white-space: nowrap; }
    .sig .cd { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); }
    .sig-top-right { display: flex; align-items: baseline; gap: 8px; }
    .sig-top-right .px { font-family: var(--num); font-size: 18px; font-weight: 700; }
    .sig-top-right .chg { font-family: var(--num); font-size: 12.5px; font-weight: 600; }
    .score-badge { display: inline-flex; min-width: 38px; height: 26px; padding: 0 8px; align-items: center; justify-content: center; border-radius: 999px; font-family: var(--num); font-weight: 700; font-size: 14px; color: var(--up); background: rgba(155,213,151,.12); margin-left: 4px; }
    .sig-chart { position: relative; margin-top: 8px; }
    .sig-chart canvas { width: 100%; height: 264px; display: block; }
    .sig-chart canvas:not(.drawn) {
      background: linear-gradient(90deg, rgba(229,212,182,.045) 25%, rgba(229,212,182,.09) 38%, rgba(229,212,182,.045) 63%);
      background-size: 400% 100%; animation: shimmer 1.5s ease infinite;
    }
    .tip { position: absolute; pointer-events: none; background: var(--pop); border: 1px solid var(--card-border); border-radius: 8px; padding: 6px 9px; font-family: var(--mono); font-size: 11.5px; display: none; z-index: 5; line-height: 1.6; color: var(--ink); }
    .sig-line { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-dim); }
    .sig-line b { color: var(--up); font-weight: 600; }
    .sig-line span.no { color: var(--ink-faint); }
    .sig-line .box { font-family: var(--mono); color: var(--ink-faint); font-size: 11.5px; }

    /* 空态 / 骨架 */
    .empty { color: var(--ink-faint); font-size: 12px; padding: 26px 0; text-align: center; }
    .empty .big { font-family: var(--num); font-size: 18px; font-weight: 700; letter-spacing: .14em; margin-bottom: 8px; }
    .empty p { margin-bottom: 14px; }
    .skel-card { height: 330px; border-radius: var(--r); background: linear-gradient(90deg, rgba(229,212,182,.045) 25%, rgba(229,212,182,.09) 38%, rgba(229,212,182,.045) 63%); background-size: 400% 100%; animation: shimmer 1.5s ease infinite; }
    @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }

    /* toast（品牌弹层色） */
    .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: var(--pop); color: var(--ink); border: 1px solid var(--card-border); border-radius: 999px; padding: 8px 20px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 90; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .modal-bg {
      position: fixed; inset: 0; background: rgba(12, 16, 32, .55);
      display: flex; align-items: center; justify-content: center;
      z-index: 80; padding: 16px;
    }
    .modal-bg[hidden] { display: none !important; }
    .modal {
      width: min(520px, 100%); background: var(--pop); border: 1px solid var(--card-border);
      border-radius: var(--r); padding: 16px 18px 14px; box-shadow: 0 16px 40px rgba(0,0,0,.35);
    }
    .modal h4 { font-size: 14px; margin-bottom: 6px; }
    .modal .hint { font-size: 12px; color: var(--ink-dim); margin-bottom: 10px; line-height: 1.55; }
    .modal textarea {
      width: 100%; min-height: 150px; resize: vertical; border-radius: 12px;
      border: 1px solid var(--card-border); background: var(--chip); color: var(--ink);
      font-family: var(--mono); font-size: 12px; padding: 10px 12px; outline: none;
    }
    .modal textarea:focus { border-color: var(--mint); }
    .modal-err { margin-top: 8px; font-size: 12px; color: var(--down); white-space: pre-wrap; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; flex-wrap: wrap; }

    /* ================= 响应式 ================= */
    @media (max-width: 900px) {
      .cards { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
      .banner-input { width: 110px; }
      .brand .b-sub { display: none; }
    }
    @media (max-width: 560px) {
      .page { padding: 10px 8px 24px; }
      .cards { grid-template-columns: 1fr; }
      .banner { padding: 8px; gap: 8px; }
      .banner-input { width: 96px; }
      .pill { padding: 4px 10px; }
      .sig-chart canvas { height: 230px; }
    }
  </style>
</head>
<body>
<div class="page">
  <div class="banner">
    <div class="brand"><span class="wordmark">TradeGenuis</span><span class="b-sub">箱体突破</span></div>
    <span class="pill"><span class="k" id="hpHitLabel">达标</span><b class="num" id="hpHit">—</b></span>
    <span class="pill pill-edit" id="hpCoverWrap" title="点击配置全市场标的覆盖池" role="button" tabindex="0">
      <span class="k">覆盖</span><b class="num" id="hpCover">—</b>
    </span>
    <label class="pill autodrop" title="每个交易日午间收盘与收盘自动全市场扫描">
      <input type="checkbox" id="autoCb" /><span>自动扫描</span><span class="mode-tag" id="autoTimes">11:30 / 15:00</span>
    </label>
    <div class="box-mode" id="familyWrap" title="识别目标：箱体/通道、高位旗形或趋势线。切换后请强制重扫">
      <span class="k">形态</span>
      <div class="tabs" id="familyTabs">
        <button class="tab on" data-family="box" type="button">箱体/通道</button>
        <button class="tab" data-family="high_flag" type="button">高位旗形(杯柄)</button>
        <button class="tab" data-family="trendline" type="button">趋势线</button>
      </div>
    </div>
    <div class="box-mode" id="boxModeWrap" title="箱体识别模式：切换后 K 线箱体立即按新规则绘制，评分需强制重扫">
      <span class="k">箱体模式</span>
      <div class="tabs" id="boxModeTabs">
        <button class="tab on" data-box-mode="classic" type="button">经典</button>
        <button class="tab" data-box-mode="p0" type="button">P0增强</button>
        <button class="tab" data-box-mode="p1" type="button" title="斜向通道：OLS 中轴 + 残差分位数 + ADX">P1通道</button>
      </div>
    </div>
    <div class="box-mode" id="cryptoIntervalWrap" title="全市场标的 K 线周期。币/金/股票代币用 Gate 原生 4h/8h/1d；无代币的美股/美指用新浪分钟K；日韩正股无代币则日K。切换后请强制重扫" style="display:none">
      <span class="k">周期</span>
      <div class="tabs" id="cryptoIntervalTabs">
        <button class="tab" data-interval="4h" type="button">4h</button>
        <button class="tab" data-interval="8h" type="button">8h</button>
        <button class="tab on" data-interval="1d" type="button">1日</button>
      </div>
    </div>
    <div class="box-mode" id="poolFilterWrap" title="全市场标的资产类别筛选" style="display:none">
      <span class="k">池</span>
      <div class="tabs" id="poolFilterTabs">
        <button class="tab on" data-pool-filter="all" type="button">全部</button>
        <button class="tab" data-pool-filter="crypto" type="button">仅币</button>
        <button class="tab" data-pool-filter="us_stock" type="button">仅美股</button>
        <button class="tab" data-pool-filter="jp" type="button">日股</button>
        <button class="tab" data-pool-filter="kr" type="button">韩股</button>
        <button class="tab" data-pool-filter="gold_index" type="button">黄金+指数</button>
      </div>
    </div>
    <div class="box-mode" id="flagFilterWrap" title="旗形阶段筛选（仅高位旗形形态）" style="display:none">
      <span class="k">筛选</span>
      <div class="tabs" id="flagFilterTabs">
        <button class="tab on" data-flag-filter="all" type="button">全部旗形</button>
        <button class="tab" data-flag-filter="handle" type="button">仅旗形</button>
        <button class="tab" data-flag-filter="secondary_buy" type="button">仅二次买点</button>
      </div>
    </div>
    <div class="box-mode" id="tlFilterWrap" title="趋势线事件筛选（仅趋势线形态）" style="display:none">
      <span class="k">筛选</span>
      <div class="tabs" id="tlFilterTabs">
        <button class="tab on" data-tl-filter="all" type="button">全部有线</button>
        <button class="tab" data-tl-filter="support_break" type="button">刚跌破支撑</button>
        <button class="tab" data-tl-filter="resistance_break" type="button">刚突破压力</button>
      </div>
    </div>
    <span class="grow"></span>
    <div class="tabs" id="marketTabs">
      <button class="tab on" data-market="stock" type="button">A股</button>
      <button class="tab" data-market="crypto" type="button">全市场标的</button>
    </div>
    <button class="act go" id="btnScan" type="button">全市场扫描</button>
    <button class="act ghost" id="btnForceScan" type="button" title="忽略1小时缓存，重新全量扫描" style="display:none">强制重扫</button>
  </div>

  <div class="scan-progress" id="scanProgress" hidden>
    <div class="scan-progress-row">
      <span class="scan-progress-title" id="scanProgressTitle">扫描进行中</span>
      <span class="num" id="scanProgressPct">0%</span>
      <span class="mono" id="scanProgressCount"></span>
    </div>
    <div class="scan-progress-track">
      <div class="scan-progress-fill" id="scanProgressFill"></div>
    </div>
    <div class="scan-progress-msg" id="scanProgressMsg"></div>
  </div>

  <section class="card">
    <div class="sec-head">
      <h3 id="cardsTitle">今日达标 <span class="plan-count" id="poolCount"></span></h3>
      <span class="cache-hint" id="cacheHint"></span>
      <span class="mode-tag" id="hotTopics" style="display:none"></span>
    </div>
    <div class="cards" id="cards"></div>
  </section>
</div>
<div class="toast" id="toast"></div>
<div class="modal-bg" id="coverModal" hidden>
  <div class="modal" role="dialog" aria-labelledby="coverModalTitle">
    <h4 id="coverModalTitle">覆盖标的池</h4>
    <p class="hint">逗号或换行分隔。非空时扫描<b>只扫这些标的</b>；清空则恢复默认混合池（币 TOP20 + 黄金 + 美/日/韩指数与龙头）。美股等优先校验 Gate <b>股票代币</b>（如 AAPL_USDT，跟踪正股但有基差，非交易所官方打印）；无代币的美股可用新浪分钟K，日韩正股再走 Naver/Sina 日K。</p>
    <textarea id="coverSymbols" placeholder="AAPL, AAPL_USDT, PLTR, .INX, 7203.T, TM, 005930, BTCUSDT, 黄金"></textarea>
    <div class="modal-err" id="coverErr"></div>
    <div class="modal-actions">
      <button class="act ghost" type="button" id="btnCoverClear">清空（用默认）</button>
      <button class="act ghost" type="button" id="btnCoverCancel">取消</button>
      <button class="act go" type="button" id="btnCoverSave">保存并校验</button>
    </div>
  </div>
</div>

<script>
"use strict";
const S = { watch: null, crypto: null, status: null, cfg: null, hot: [], loaded: false, kbars: {}, market: "stock", selBoard: null, flagFilter: "all", tlFilter: "all", poolFilter: "all", override: { symbols: [], count: 0, mode: "default" } };
const $ = id => document.getElementById(id);
const fmt2 = v => (v === null || v === undefined || isNaN(v)) ? "—" : Number(v).toFixed(2);
const fmtc = v => (v === null || v === undefined || isNaN(v)) ? "—" : (v >= 1 ? Number(v).toFixed(2) : Number(v).toPrecision(4));
const sign = v => (v > 0 ? "+" : "") + fmt2(v);
// A股涨红跌绿；币圈涨绿跌红
const clsOf = v => v > 0 ? "up" : v < 0 ? "down" : "flat";
const signOf = (v, market) => (v > 0 ? "+" : "") + (market === "crypto" ? fmtc(v) : fmt2(v));
const moneyW = w => w === null || w === undefined ? "—" :
  Math.abs(w) >= 10000 ? (w / 10000).toFixed(1) + "亿" : Math.round(w) + "万";

let toastTimer = null;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}

async function jfetch(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error(path + " -> " + r.status);
  return r.json();
}
async function loadAll() {
  const [w, c, st, cfg, ov] = await Promise.all([
    jfetch("api/watchlist"),
    jfetch("api/crypto").catch(() => null),
    jfetch("api/status").catch(() => null),
    jfetch("api/config").catch(() => null),
    jfetch("api/global_pool/override").catch(() => null),
  ]);
  S.watch = w; S.crypto = c; S.status = st; S.cfg = cfg; S.loaded = true;
  if (ov) S.override = ov;
  S.hot = (w && w.hot_topics) || [];
  renderAll();
  jfetch("api/hot").then(hot => {
    if ((hot.hot_topics || []).length) {
      S.hot = hot.hot_topics;
      if (S.market === "stock") renderAll();
    }
  }).catch(() => {});
}
async function refresh() { try { await loadAll(); } catch (e) {} }

/* =============================== 渲染 =============================== */
function parseStamp(s) {
  if (!s) return null;
  const iso = Date.parse(s);
  if (!isNaN(iso)) return new Date(iso);
  const bj = Date.parse(String(s).replace(" ", "T") + "+08:00");
  return isNaN(bj) ? null : new Date(bj);
}
function hhmm(d) {
  try {
    return new Intl.DateTimeFormat("zh-CN", {
      timeZone: "Asia/Shanghai", hour: "2-digit", minute: "2-digit", hour12: false
    }).format(d);
  } catch (e) {
    return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }
}
function cacheHintText(data) {
  if (!data || data.done === false) return "";
  const ts = data.updated || data.as_of;
  const d = parseStamp(ts);
  if (!d) return "";
  const age = (Date.now() - d.getTime()) / 1000;
  const when = hhmm(d);
  if (age < 3600) return `缓存 · 更新于 ${when} · 1小时内不重复全量扫描`;
  return `缓存 · 更新于 ${when} · 可强制重扫`;
}
function boxModeLabel(mode) {
  return { classic: "经典", p0: "P0增强", p1: "P1通道" }[mode] || "经典";
}
function familyLabel(fam) {
  return { box: "箱体/通道", high_flag: "高位旗形(杯柄)", trendline: "趋势线" }[fam] || "箱体/通道";
}
function currentFamily() {
  return (S.cfg && S.cfg.pattern_family) || "box";
}
function currentInterval() {
  return (S.cfg && S.cfg.crypto_interval) || "1d";
}
function intervalLabel(iv) {
  return { "4h": "4h", "8h": "8h", "1d": "1日" }[iv] || "1日";
}
function assetClassOf(r) {
  return r.asset_class || (r.market === "crypto" ? "crypto" : "stock");
}
function assetBadgeHTML(r) {
  const cls = typeof r === "string" ? r : assetClassOf(r);
  const tok = typeof r === "object" && r && r.tokenized;
  const lab = {
    crypto: "币", gold: "金",
    us_index: tok ? "美指代币" : "美指", us_stock: tok ? "美股代币" : "美股",
    jp_index: tok ? "日指代币" : "日指", jp_stock: tok ? "日股代币" : "日股",
    kr_index: tok ? "韩指代币" : "韩指", kr_stock: tok ? "韩股代币" : "韩股",
  }[cls];
  if (!lab) return "";
  return `<span class="asset-badge ${cls}${tok ? " tokenized" : ""}">${lab}</span>`;
}
function matchPoolFilter(r, flt) {
  if (!flt || flt === "all") return true;
  const c = assetClassOf(r);
  if (flt === "gold_index") return c === "gold" || String(c).endsWith("_index");
  if (flt === "jp") return c === "jp_stock" || c === "jp_index";
  if (flt === "kr") return c === "kr_stock" || c === "kr_index";
  return c === flt;
}
function poolCountBits(rows) {
  const n = { crypto: 0, gold: 0, us_index: 0, us_stock: 0, jp_index: 0, jp_stock: 0, kr_index: 0, kr_stock: 0 };
  (rows || []).forEach(r => { const c = assetClassOf(r); if (n[c] != null) n[c]++; });
  const bits = [];
  if (n.crypto) bits.push("币" + n.crypto);
  if (n.gold) bits.push("金" + n.gold);
  if (n.us_index) bits.push("美指" + n.us_index);
  if (n.us_stock) bits.push("美股" + n.us_stock);
  if (n.jp_index + n.jp_stock) bits.push("日" + (n.jp_index + n.jp_stock));
  if (n.kr_index + n.kr_stock) bits.push("韩" + (n.kr_index + n.kr_stock));
  return bits.join(" · ");
}
function flagStageLabel(stage) {
  return { handle: "旗形整理", secondary_buy: "二次买点" }[stage] || "";
}
function tlEventLabel(ev) {
  return { support_break: "跌破支撑", resistance_break: "突破压力" }[ev] || "";
}
function tlBadgeHTML(ev) {
  const lab = tlEventLabel(ev);
  if (!lab) return "";
  const cls = ev === "resistance_break" ? "tl-res" : "tl-sup";
  return `<span class="flag-badge ${cls}">${lab}</span>`;
}
function boxKindLabel(kind) {
  return { ascending: "上升", descending: "下降", flat_fallback: "近水平" }[kind] || "";
}
function boxQualityRejected(q) {
  return q === "amplitude_reject" || q === "slope_reject" || q === "r2_reject"
    || q === "vshape_reject" || q === "adx_reject";
}
function boxRejectNote(q) {
  if (q === "amplitude_reject") return "非箱体·振幅过大";
  if (q === "slope_reject") return "非通道·斜率过陡";
  if (q === "r2_reject") return "非通道·拟合不佳";
  if (q === "vshape_reject") return "非通道·V形";
  if (q === "adx_reject") return "非通道·趋势过强";
  return "";
}
function boxLineText(src) {
  if (!src) return "";
  const mode = boxModeLabel(src.box_mode || "classic");
  const reject = boxRejectNote(src.box_quality);
  if (reject) return reject + " · " + mode;
  if (src.box_low == null || src.box_high == null) return mode;
  let s = `箱体 ${fmt2(src.box_low)}–${fmt2(src.box_high)} · ${mode}`;
  const kind = boxKindLabel(src.box_kind);
  if (kind) s += " · " + kind;
  if (src.box_quality === "weak") s += " · 偏弱";
  return s;
}
function tlMetricsText(src) {
  const tl = src && (src.tl_support || src.tl_resistance) ? src : (src && src.trendline) || src || {};
  const bits = [];
  if (tl.tl_support && tl.tl_support.L_now != null) bits.push("支撑 " + fmt2(tl.tl_support.L_now));
  if (tl.tl_resistance && tl.tl_resistance.L_now != null) bits.push("压力 " + fmt2(tl.tl_resistance.L_now));
  const q = tl.tl_quality || "";
  if (q && q !== "none") bits.push(q);
  const ev = tlEventLabel(tl.tl_event);
  if (ev) bits.push(ev);
  return bits.join(" · ") || "趋势线";
}
function channelSeries(box, bars) {
  const pts = (box && box.channel_points) || [];
  if (!pts.length) return null;
  const byDate = {};
  pts.forEach(p => { if (p && p.date) byDate[p.date] = p; });
  const mid = [], up = [], down = [];
  let hit = 0;
  bars.forEach(b => {
    const p = byDate[b.date];
    if (p) hit++;
    mid.push(p && p.mid != null ? Number(p.mid) : null);
    up.push(p && p.up != null ? Number(p.up) : null);
    down.push(p && p.down != null ? Number(p.down) : null);
  });
  return hit ? { mid, up, down } : null;
}
function strokeChannel(ctx, xs, ys, y, col, dash) {
  ctx.save();
  ctx.strokeStyle = col;
  if (dash) ctx.setLineDash(dash);
  ctx.beginPath();
  let started = false;
  for (let i = 0; i < xs.length; i++) {
    if (ys[i] == null || Number.isNaN(ys[i])) { started = false; continue; }
    const yy = y(ys[i]);
    if (!started) { ctx.moveTo(xs[i], yy); started = true; }
    else ctx.lineTo(xs[i], yy);
  }
  ctx.stroke();
  ctx.restore();
}
function edgeEventLabel(kind) {
  return {
    test: "试盘",
    breakout_candidate: "潜在突破",
    breakout_confirmed: "真突破",
    breakout_failed: "失败突破",
  }[kind] || "";
}
function edgeBadgeHTML(kind) {
  const lab = edgeEventLabel(kind);
  if (!lab) return "";
  const cls = kind === "test" ? "edge-test"
    : kind === "breakout_confirmed" ? "edge-bo"
    : kind === "breakout_failed" ? "edge-fail" : "edge-cand";
  return `<span class="edge-badge ${cls}">${lab}</span>`;
}

function renderAll() {
  const isCrypto = S.market === "crypto";
  const data = isCrypto ? (S.crypto || {}) : (S.watch || {});
  const rows = data.candidates || data.items || [];
  const fam = currentFamily();
  const flagHits = rows.filter(r => r.pattern === "high_flag");
  const tlHits = rows.filter(r => r.tl_has_line || r.tl_support || r.tl_resistance);
  const hits = fam === "high_flag" ? flagHits : fam === "trendline" ? tlHits : rows.filter(r => r.qualified);
  const scope = data.scope;

  $("hpHitLabel").textContent = fam === "high_flag" ? "旗形" : fam === "trendline" ? "趋势线" : "达标";
  $("hpHit").textContent = S.loaded ? hits.length : "—";
  if (!S.loaded) {
    $("hpCover").textContent = "—";
  } else if (isCrypto) {
    const ov = S.override || {};
    $("hpCover").textContent = ov.mode === "override" ? ((ov.count || 0) + " 只") : "默认";
  } else {
    $("hpCover").textContent = scope === "market" ? (data.universe_size ?? "—") + " 只" : "自选池";
  }
  $("poolCount").textContent = S.loaded ? hits.length : "";
  if (fam === "high_flag") {
    const nBuy = flagHits.filter(r => r.flag_stage === "secondary_buy").length;
    $("cardsTitle").innerHTML = `高位旗形 <span class="plan-count" id="poolCount">${S.loaded ? hits.length : ""}</span>`
      + (nBuy ? ` <span class="mode-tag" style="color:var(--up)">二次买点 ${nBuy}</span>` : "");
  } else if (fam === "trendline") {
    const nBrk = tlHits.filter(r => r.tl_event === "support_break").length;
    const nBo = tlHits.filter(r => r.tl_event === "resistance_break").length;
    $("cardsTitle").innerHTML = `趋势线 <span class="plan-count" id="poolCount">${S.loaded ? hits.length : ""}</span>`
      + (nBrk || nBo ? ` <span class="mode-tag">跌破 ${nBrk} · 突破 ${nBo}</span>` : "");
  } else if (scope === "crypto") {
    const bits = poolCountBits(rows);
    $("cardsTitle").innerHTML = `全市场标的 <span class="plan-count" id="poolCount">${S.loaded ? rows.length : ""}</span>`
      + (bits ? ` <span class="mode-tag">${bits}</span>` : "")
      + ` <span class="mode-tag" style="color:var(--up)">达标 ${hits.length}</span>`;
  } else if (S.selBoard) {
    $("cardsTitle").innerHTML = `板块「${S.selBoard}」 <span class="plan-count" id="poolCount" data-board-count>—</span>`;
  } else {
    $("cardsTitle").innerHTML = `今日达标 <span class="plan-count" id="poolCount">${S.loaded ? hits.length : ""}</span>`;
  }
  const hint = $("cacheHint");
  let hintText = S.loaded ? cacheHintText(data) : "";
  const cfgMode = (S.cfg && S.cfg.box_mode) || "classic";
  const scanMode = data.box_mode || "classic";
  const cfgFam = fam;
  const scanFam = data.pattern_family || "box";
  const cfgIv = currentInterval();
  const scanIv = data.crypto_interval || "1d";
  if (S.loaded && cfgFam !== scanFam && (rows.length || data.updated || data.as_of)) {
    hintText = (hintText ? hintText + " · " : "") +
      `扫描结果来自「${familyLabel(scanFam)}」，当前为「${familyLabel(cfgFam)}」，请强制重扫以更新`;
  } else if (isCrypto && S.loaded && cfgIv !== scanIv && (rows.length || data.updated || data.as_of)) {
    hintText = (hintText ? hintText + " · " : "") +
      `扫描结果来自「${intervalLabel(scanIv)}」，当前为「${intervalLabel(cfgIv)}」，请强制重扫以更新`;
  } else if (isCrypto && S.loaded && ((data.override_fingerprint || "") !== ((S.override && S.override.fingerprint) || "")) && (rows.length || data.updated || data.as_of)) {
    hintText = (hintText ? hintText + " · " : "") +
      "覆盖池已变更，当前结果来自旧池，请强制重扫";
  } else if (S.loaded && cfgMode !== scanMode && (rows.length || data.updated || data.as_of)) {
    hintText = (hintText ? hintText + " · " : "") +
      `评分来自「${boxModeLabel(scanMode)}」，当前为「${boxModeLabel(cfgMode)}」，请强制重扫以更新评分`;
  }
  hint.textContent = hintText;
  const forceBtn = $("btnForceScan");
  if (forceBtn) forceBtn.style.display = (S.loaded && (rows.length || data.updated || data.as_of)) ? "" : "none";
  // A股：展示当前热门板块（可点击筛选）；接口限流则诚实提示
  const hotEl = $("hotTopics");
  if (!isCrypto) {
    hotEl.style.display = "";
    if (S.hot.length) {
      hotEl.innerHTML = `<span style="color:var(--ink-faint)">热门板块：</span>` + S.hot.map(b =>
        `<span class="hot-chip${S.selBoard === b.name ? ' sel' : ''}" data-board="${b.name}">${b.name}${b.chg1 > 0 ? ' <span class="h-chg ' + (b.chg1 > 0 ? 'up' : 'down') + '">' + b.chg1.toFixed(1) + '%</span>' : ''}</span>`
      ).join("");
    } else {
      hotEl.innerHTML = `<span class="hot-chip" style="color:var(--ink-faint)">热门板块数据未获取（接口限流）</span>`;
    }
  } else {
    hotEl.style.display = "none";
  }
  renderCards(rows);
  renderCfg();
  renderScanProgress(S.status);
}

function renderCfg() {
  if (!S.cfg) return;
  $("autoCb").checked = !!S.cfg.auto;
  $("autoTimes").textContent = (S.cfg.auto_times || ["11:30", "15:00"]).join(" / ");
  const boxMode = S.cfg.box_mode || "classic";
  document.querySelectorAll("#boxModeTabs .tab").forEach(t => {
    t.classList.toggle("on", t.dataset.boxMode === boxMode);
  });
  const fam = currentFamily();
  document.querySelectorAll("#familyTabs .tab").forEach(t => {
    t.classList.toggle("on", t.dataset.family === fam);
  });
  const boxWrap = $("boxModeWrap");
  if (boxWrap) {
    boxWrap.classList.toggle("dimmed", fam !== "box");
    boxWrap.style.display = fam !== "box" ? "none" : "";
  }
  const flagWrap = $("flagFilterWrap");
  if (flagWrap) flagWrap.style.display = fam === "high_flag" ? "" : "none";
  document.querySelectorAll("#flagFilterTabs .tab").forEach(t => {
    t.classList.toggle("on", t.dataset.flagFilter === S.flagFilter);
  });
  const tlWrap = $("tlFilterWrap");
  if (tlWrap) tlWrap.style.display = fam === "trendline" ? "" : "none";
  document.querySelectorAll("#tlFilterTabs .tab").forEach(t => {
    t.classList.toggle("on", t.dataset.tlFilter === S.tlFilter);
  });
  document.querySelectorAll("#marketTabs .tab").forEach(t => {
    t.classList.toggle("on", t.dataset.market === S.market);
  });
  const ivWrap = $("cryptoIntervalWrap");
  if (ivWrap) ivWrap.style.display = S.market === "crypto" ? "" : "none";
  const iv = currentInterval();
  document.querySelectorAll("#cryptoIntervalTabs .tab").forEach(t => {
    t.classList.toggle("on", t.dataset.interval === iv);
  });
  const pfWrap = $("poolFilterWrap");
  if (pfWrap) pfWrap.style.display = S.market === "crypto" ? "" : "none";
  document.querySelectorAll("#poolFilterTabs .tab").forEach(t => {
    t.classList.toggle("on", t.dataset.poolFilter === S.poolFilter);
  });
}

/* =============================== 达标卡片 =============================== */
function renderCards(rows) {
  const box = $("cards");
  if (!S.loaded) {
    disconnectCharts();
    box.innerHTML = Array(3).fill('<div class="skel-card"></div>').join("");
    return;
  }
  const isCrypto = S.market === "crypto";
  const fam = currentFamily();
  // 全市场标的：展示进池子全部标的（可按币/美股/日股/韩股/黄金+指数筛选），达标高亮
  // A股：默认只展示达标；选中板块后展示该板块全部股票（按评分降序）
  // 高位旗形：批量筛选旗面 / 二次买点（不走四条件达标）
  let shown;
  if (fam === "high_flag") {
    shown = rows.filter(r => r.pattern === "high_flag");
    if (S.flagFilter === "handle") {
      shown = shown.filter(r => r.flag_stage === "handle" || r.is_handle_consolidation);
    } else if (S.flagFilter === "secondary_buy") {
      shown = shown.filter(r => r.flag_stage === "secondary_buy" || r.secondary_breakout_buy);
    }
    if (!isCrypto && S.selBoard) {
      shown = shown.filter(r => {
        const c = (r.concepts || []).concat(r.hot_boards || []);
        return c.some(n => n === S.selBoard || (n && S.selBoard && (n.includes(S.selBoard) || S.selBoard.includes(n))));
      });
    }
    if (isCrypto) shown = shown.filter(r => matchPoolFilter(r, S.poolFilter));
    shown = shown.slice().sort((a, b) => {
      const ab = (b.secondary_breakout_buy ? 1 : 0) - (a.secondary_breakout_buy ? 1 : 0);
      if (ab) return ab;
      return (b.pole_gain || 0) - (a.pole_gain || 0);
    });
    const titleBits = {
      handle: "旗形整理",
      secondary_buy: "二次买点",
    };
    const title = titleBits[S.flagFilter] || "高位旗形";
    $("cardsTitle").innerHTML = `${title} <span class="plan-count" id="poolCount">${shown.length}</span>`;
    $("hpHit").textContent = shown.length;
  } else if (fam === "trendline") {
    shown = rows.filter(r => r.tl_has_line || r.tl_support || r.tl_resistance);
    if (S.tlFilter === "support_break") {
      shown = rows.filter(r => r.tl_event === "support_break");
    } else if (S.tlFilter === "resistance_break") {
      shown = rows.filter(r => r.tl_event === "resistance_break");
    }
    if (!isCrypto && S.selBoard) {
      shown = shown.filter(r => {
        const c = (r.concepts || []).concat(r.hot_boards || []);
        return c.some(n => n === S.selBoard || (n && S.selBoard && (n.includes(S.selBoard) || S.selBoard.includes(n))));
      });
    }
    if (isCrypto) shown = shown.filter(r => matchPoolFilter(r, S.poolFilter));
    shown = shown.slice().sort((a, b) => {
      const rank = ev => ev === "resistance_break" ? 2 : ev === "support_break" ? 1 : 0;
      const er = rank(b.tl_event) - rank(a.tl_event);
      if (er) return er;
      const q = (x) => x === "ok" ? 2 : x === "weak" ? 1 : 0;
      return q(b.tl_quality) - q(a.tl_quality);
    });
    const titleBits = {
      support_break: "刚跌破支撑",
      resistance_break: "刚突破压力",
    };
    const title = titleBits[S.tlFilter] || "趋势线";
    $("cardsTitle").innerHTML = `${title} <span class="plan-count" id="poolCount">${shown.length}</span>`;
    $("hpHit").textContent = shown.length;
  } else if (isCrypto) {
    shown = rows.filter(r => matchPoolFilter(r, S.poolFilter)).slice().sort((a, b) => (b.chg || 0) - (a.chg || 0));
    if (S.poolFilter !== "all") {
      $("cardsTitle").innerHTML = `全市场标的 <span class="plan-count" id="poolCount">${shown.length}</span>`
        + (poolCountBits(shown) ? ` <span class="mode-tag">${poolCountBits(shown)}</span>` : "");
    }
  } else if (S.selBoard) {
    shown = rows.filter(r => {
      const c = (r.concepts || []).concat(r.hot_boards || []);
      return c.some(n => n === S.selBoard || (n && S.selBoard && (n.includes(S.selBoard) || S.selBoard.includes(n))));
    }).sort((a, b) => (b.score || 0) - (a.score || 0));
    const cnt = document.querySelector("[data-board-count]");
    if (cnt) cnt.textContent = shown.length;
  } else {
    shown = rows.filter(r => r.qualified);
  }
  disconnectCharts();
  if (!shown.length) {
    const emptyMsg = currentFamily() === "high_flag"
      ? (S.flagFilter === "secondary_buy" ? "暂无二次买点" : "暂无高位旗形匹配")
      : currentFamily() === "trendline"
        ? (S.tlFilter === "support_break" ? "暂无刚跌破支撑"
          : S.tlFilter === "resistance_break" ? "暂无刚突破压力" : "暂无有效趋势线")
      : (S.selBoard ? `该板块暂无股票` : "暂无数据");
    box.innerHTML = `<div class="empty"><div class="big">NO SIGNAL</div><p>${emptyMsg}</p>
      <button class="act go" type="button" onclick="doScan(false)">${isCrypto ? "全市场标的扫描" : "全市场扫描"}</button></div>`;
    return;
  }
  // 币圈仍列出全部进池标的；K 线只在卡片进入视口附近才拉取（见 observeCardCharts）
  box.innerHTML = shown.map((r, i) => cardHTML(r, i)).join("");
  observeCardCharts();
}

  return `<article class="sig${hiLite ? ' q' : ''}" data-code="${r.code}" data-market="${S.market}" data-qualified="${r.qualified ? 1 : 0}" style="animation-delay:${Math.min(i * 50, 400)}ms">

      <div class="sig-top-right"><span class="px" data-px>${price}</span>

/* K 线：视口懒加载 + 有限并发，避免进页时对 N 张卡片同时打满上游 */
const KLINE_MAX_INFLIGHT = 4;
const KLINE_ROOT_MARGIN = "280px 0px";
let chartObserver = null;
let klineInflight = 0;
const klineQueue = [];
const klineWaiters = new Map();

function escSel(s) {
  if (window.CSS && CSS.escape) return CSS.escape(String(s));
  return String(s).replace(/["\\]/g, "\\$&");
}
function cardCanvas(code, market) {
  return document.querySelector(`.sig[data-code="${escSel(code)}"][data-market="${escSel(market)}"] .sig-chart canvas`);
}
function disconnectCharts() {
  if (chartObserver) { chartObserver.disconnect(); chartObserver = null; }
}
function resetKlineQueue() {
  klineQueue.length = 0;
  klineWaiters.clear();
}
function chartPriority(code, market) {
  const el = document.querySelector(`.sig[data-code="${escSel(code)}"][data-market="${escSel(market)}"]`);
  if (el && (el.classList.contains("q") || el.dataset.qualified === "1")) return 0;
  return 1;
}
function klineOk(d) {
  return d && !d.error && (d.bars || []).length;
}
function ensureK(code, market) {
  market = market || S.market;
  const iv = market === "crypto" ? currentInterval() : "";
  const key = market + ":" + code + (iv ? (":" + iv) : "");
  const hit = S.kbars[key];
  if (klineOk(hit)) return Promise.resolve(hit);
  return new Promise(resolve => {
    if (!klineWaiters.has(key)) {
      klineWaiters.set(key, []);
      klineQueue.push({ key, code, market, priority: chartPriority(code, market) });
      klineQueue.sort((a, b) => a.priority - b.priority);
    }
    klineWaiters.get(key).push(resolve);
    pumpKlineQueue();
  });
}
function pumpKlineQueue() {
  while (klineInflight < KLINE_MAX_INFLIGHT && klineQueue.length) {
    const job = klineQueue.shift();
    klineInflight++;
    (async () => {
      let d = null;
      try {
        d = await jfetch("api/kline?code=" + encodeURIComponent(job.code) + "&lmt=100&market=" + encodeURIComponent(job.market));
      } catch (e) { d = null; }
      if (klineOk(d)) S.kbars[job.key] = d;
      const waiters = klineWaiters.get(job.key) || [];
      klineWaiters.delete(job.key);
      waiters.forEach(fn => fn(d));
      klineInflight--;
      pumpKlineQueue();
    })();
  }
}
async function loadChart(code, market) {
  market = market || S.market;
  const d = await ensureK(code, market);
  if (!klineOk(d)) return;
  const cv = cardCanvas(code, market);
  if (cv) drawChart(cv, d);
  const card = document.querySelector(`.sig[data-code="${escSel(code)}"][data-market="${escSel(market)}"]`);
  const boxEl = card && card.querySelector("[data-metrics]");
  const fam = (d.pattern_family || currentFamily());
  if (boxEl && fam === "high_flag" && d.flag && d.flag.pattern === "high_flag") {
    boxEl.textContent = `旗面 ${fmt2(d.flag.handle_low)}–${fmt2(d.flag.handle_high)} · ${d.flag.flag_quality || ""}`;
  } else if (boxEl && fam === "trendline" && d.trendline) {
    boxEl.textContent = tlMetricsText(d.trendline);
  } else if (boxEl && d.box) {
    boxEl.textContent = boxLineText({ ...d.box, box_mode: d.box_mode || d.box.box_mode || "classic" });
  }
  const host = card && card.querySelector("[data-edge-host]");
  if (host && (fam === "high_flag" || fam === "trendline")) {
    host.innerHTML = "";
  } else if (host && d.box) host.innerHTML = edgeBadgeHTML(d.box.edge_event);
  if (card && market === "crypto" && d.interval_note) {
    const nm = card.querySelector(".nm");
    if (nm && !nm.querySelector(".interval-note")) {
      const note = document.createElement("span");
      note.className = "interval-note";
      note.textContent = d.interval_note;
      nm.appendChild(note);
    }
  }
}
function observeCardCharts() {
  disconnectCharts();
  const canvases = [...document.querySelectorAll("#cards .sig-chart canvas")];
  if (!canvases.length) return;
  if (!("IntersectionObserver" in window)) {
    canvases.sort((a, b) => chartPriority(a.dataset.code, a.dataset.market) - chartPriority(b.dataset.code, b.dataset.market));
    canvases.forEach(cv => loadChart(cv.dataset.code, cv.dataset.market));
    return;
  }
  chartObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const cv = entry.target;
      chartObserver.unobserve(cv);
      loadChart(cv.dataset.code, cv.dataset.market);
    });
  }, { root: null, rootMargin: KLINE_ROOT_MARGIN, threshold: 0.01 });
  canvases.forEach(cv => chartObserver.observe(cv));
}

function strokeTl(ctx, bars, points, y, col, padL, step) {
  const idx = {};
  bars.forEach((b, i) => { idx[b.date] = i; });
  const seq = (points || []).filter(p => p && p.date in idx && p.price != null);
  if (seq.length < 2) return;
  ctx.save();
  ctx.lineWidth = 1.6;
  ctx.setLineDash([5, 4]);
  ctx.strokeStyle = col;
  ctx.beginPath();
  seq.forEach((p, n) => {
    const i = idx[p.date];
    const x = padL + i * step + step / 2;
    const yy = y(Number(p.price));
    if (n === 0) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
  });
  ctx.stroke();
  ctx.restore();
}

function drawChart(cv, d) {
  const code = cv.dataset.code;
  const market = cv.dataset.market || "stock";
  const isCrypto = market === "crypto";
  const cssW = cv.clientWidth || 330, cssH = 264, dpr = window.devicePixelRatio || 1;
  cv.width = cssW * dpr; cv.height = cssH * dpr;
  const ctx = cv.getContext("2d"); ctx.scale(dpr, dpr);
  const W = cssW, H = cssH, padL = 6, padR = 52, padT = 12, vh = Math.round(H * 0.68), volH = H - vh - 28;
  const bars = d.bars || [];
  if (!bars.length) return;
  cv.classList.add("drawn");
  const box = d.box || {};
  const rejected = boxQualityRejected(box.box_quality);
  const ch = (!rejected && channelSeries(box, bars)) || null;
  const tln = d.trendline || {};
  const family = d.pattern_family || currentFamily();
  let lo = Infinity, hi = -Infinity, vmax = 0;
  bars.forEach(b => { lo = Math.min(lo, b.low); hi = Math.max(hi, b.high); vmax = Math.max(vmax, b.vol); });
  if (ch) {
    ch.up.forEach(v => { if (v != null) { hi = Math.max(hi, v); lo = Math.min(lo, v); } });
    ch.down.forEach(v => { if (v != null) { hi = Math.max(hi, v); lo = Math.min(lo, v); } });
    ch.mid.forEach(v => { if (v != null) { hi = Math.max(hi, v); lo = Math.min(lo, v); } });
  }
  if (family === "trendline") {
    (((tln.tl_points || {}).support) || []).concat(((tln.tl_points || {}).resistance) || []).forEach(p => {
      if (p && p.price != null) { hi = Math.max(hi, Number(p.price)); lo = Math.min(lo, Number(p.price)); }
    });
  }
  const span = (hi - lo) || 1e-9;
  const n = bars.length, step = (W - padL - padR) / n, bw = Math.max(1, Math.min(8, step * 0.62));
  const y = v => padT + (hi - v) / span * vh;
  const flag = d.flag || {};
  ctx.clearRect(0, 0, W, H);
  ctx.font = "10px IBM Plex Mono, monospace";
  ctx.lineWidth = 1;
  const priceFmt = isCrypto ? (v => v >= 1 ? v.toFixed(2) : v.toPrecision(3)) : (v => v.toFixed(2));
  for (let i = 0; i <= 4; i++) {
    const yy = padT + i / 4 * vh, v = hi - i / 4 * span;
    ctx.strokeStyle = "rgba(229,212,182,.07)"; ctx.beginPath(); ctx.moveTo(padL, yy); ctx.lineTo(W - padR, yy); ctx.stroke();
    ctx.fillStyle = "rgba(229,212,182,.4)"; ctx.textAlign = "left"; ctx.fillText(priceFmt(v), W - padR + 6, yy + 3);
  }
  if (family === "high_flag" && flag.pattern === "high_flag" && flag.handle_high != null && flag.handle_start != null) {
    const hs = Math.max(0, flag.handle_start), he = Math.min(n - 1, flag.handle_end);
    const x0 = padL + hs * step, x1 = padL + (he + 1) * step;
    const yHi = Math.max(padT, Math.min(padT + vh, y(Number(flag.handle_high))));
    const yLo = Math.max(padT, Math.min(padT + vh, y(Number(flag.handle_low))));
    ctx.fillStyle = "rgba(232,196,138,.14)";
    ctx.fillRect(x0, Math.min(yHi, yLo), Math.max(1, x1 - x0), Math.max(1, Math.abs(yLo - yHi)));
    ctx.save(); ctx.setLineDash([5, 4]); ctx.strokeStyle = "#E8C48A"; ctx.beginPath();
    ctx.moveTo(padL, yHi); ctx.lineTo(W - padR, yHi); ctx.stroke(); ctx.restore();
    ctx.fillStyle = "#E8C48A"; ctx.fillText("二次 " + priceFmt(Number(flag.handle_high)), padL + 2, yHi - 4);
    if (flag.pole_index != null && flag.pole_index >= 0 && flag.pole_index < n) {
      const px = padL + flag.pole_index * step + step / 2;
      ctx.fillStyle = "rgba(155,213,151,.18)";
      ctx.fillRect(px - Math.max(2, bw), padT, Math.max(4, bw * 2), vh);
    }
  } else if (family === "trendline") {
    if (tln.tl_event_bar) {
      const bi = bars.findIndex(b => b.date === tln.tl_event_bar);
      if (bi >= 0) {
        const px = padL + bi * step + step / 2;
        ctx.fillStyle = tln.tl_event === "support_break" ? "rgba(240,122,99,.22)" : "rgba(155,213,151,.22)";
        ctx.fillRect(px - Math.max(2, bw), padT, Math.max(4, bw * 2), vh);
      }
    }
  } else if (!rejected && ch) {
    const xs = bars.map((_, i) => padL + i * step + step / 2);
    strokeChannel(ctx, xs, ch.up, y, "#8FC98B", [5, 4]);
    strokeChannel(ctx, xs, ch.mid, y, "rgba(229,212,182,.45)", [3, 3]);
    strokeChannel(ctx, xs, ch.down, y, "rgba(229,212,182,.35)", [5, 4]);
    const lastUp = [...ch.up].reverse().find(v => v != null);
    const lastDn = [...ch.down].reverse().find(v => v != null);
    if (lastUp != null) {
      ctx.fillStyle = "#8FC98B";
      ctx.fillText(priceFmt(Number(lastUp)), padL + 2, Math.max(padT + 10, y(lastUp) - 4));
    }
    if (lastDn != null) {
      ctx.fillStyle = "rgba(229,212,182,.55)";
      ctx.fillText(priceFmt(Number(lastDn)), padL + 2, Math.min(padT + vh - 2, y(lastDn) + 12));
    }
  } else if (!rejected && box.box_high != null) {
    [[box.box_high, "#8FC98B"], [box.box_low, "rgba(229,212,182,.35)"]].forEach(([v, col]) => {
      const yy = Math.max(padT, Math.min(padT + vh, y(v)));
      ctx.save(); ctx.setLineDash([5, 4]); ctx.strokeStyle = col; ctx.beginPath();
      ctx.moveTo(padL, yy); ctx.lineTo(W - padR, yy); ctx.stroke(); ctx.restore();
      ctx.fillStyle = col; ctx.fillText(priceFmt(Number(v)), padL + 2, yy - 4);
    });
  } else if (rejected) {
    const note = boxRejectNote(box.box_quality);
    if (note) {
      ctx.fillStyle = "rgba(240,122,99,.9)";
      ctx.textAlign = "left";
      ctx.fillText(note, padL + 4, padT + 12);
    }
  }
  bars.forEach((b, i) => {
    const x = padL + i * step + step / 2, up = b.close >= b.open;
    // A股涨红跌绿；币圈涨绿跌红（国际惯例）
    const col = isCrypto ? (up ? "#4E9D63" : "#E2604F") : (up ? "#E2604F" : "#4E9D63");
    ctx.strokeStyle = col; ctx.fillStyle = col;
    const x0 = Math.max(padL, x - bw / 2), x1 = Math.min(W - padR, x + bw / 2);
    const yO = y(b.open), yC = y(b.close);
    ctx.beginPath(); ctx.moveTo(x, y(b.high)); ctx.lineTo(x, y(b.low)); ctx.stroke();
    ctx.fillRect(x0, Math.min(yO, yC), Math.max(1, x1 - x0), Math.max(1, Math.abs(yC - yO)));
    const vy = vh + 10 + (1 - b.vol / vmax) * volH;
    ctx.globalAlpha = 0.35; ctx.fillRect(x0, vy, Math.max(1, x1 - x0), Math.max(1, vh + 10 + volH - vy)); ctx.globalAlpha = 1;
  });
  if (family === "trendline") {
    const pts = tln.tl_points || {};
    strokeTl(ctx, bars, pts.support, y, "#8FC98B", padL, step);
    strokeTl(ctx, bars, pts.resistance, y, "#F07A63", padL, step);
    ctx.textAlign = "left";
    if (tln.tl_support && tln.tl_support.L_now != null) {
      ctx.fillStyle = "#8FC98B";
      ctx.fillText("支撑 " + priceFmt(Number(tln.tl_support.L_now)), padL + 2, Math.min(padT + vh - 2, y(Number(tln.tl_support.L_now)) + 12));
    }
    if (tln.tl_resistance && tln.tl_resistance.L_now != null) {
      ctx.fillStyle = "#F07A63";
      ctx.fillText("压力 " + priceFmt(Number(tln.tl_resistance.L_now)), padL + 2, Math.max(padT + 10, y(Number(tln.tl_resistance.L_now)) - 4));
    }
  }
  ctx.fillStyle = "rgba(229,212,182,.4)"; ctx.textAlign = "right";
  ctx.fillText((vmax / 10000).toFixed(0) + "万手", W - padR, vh + 20);
  ctx.strokeStyle = "rgba(229,212,182,.07)"; ctx.beginPath(); ctx.moveTo(padL, vh + 10); ctx.lineTo(W - padR, vh + 10); ctx.stroke();
  ctx.textAlign = "center";
  [0, Math.floor(n / 4), Math.floor(n / 2), Math.floor(n * 3 / 4), n - 1].forEach(i => {
    ctx.fillStyle = "rgba(229,212,182,.4)";
    const lab = String(bars[i].date || "");
    ctx.fillText(lab.length >= 16 ? lab.slice(5, 16) : lab.slice(5), padL + i * step + step / 2, H - 4);
  });

  const evMap = {};
  (box.edge_events || []).forEach(e => { if (e && e.date) evMap[e.date] = e.kind; });
  const tip = document.querySelector(`.tip[data-code="${code}"]`);
  if (!tip) return;
  cv.onmousemove = ev => {
    const rect = cv.getBoundingClientRect();
    const i = Math.max(0, Math.min(n - 1, Math.floor((ev.clientX - rect.left - padL) / step)));
    if (i < 0 || i >= n) return;
    const b = bars[i];
    tip.style.display = "block";
    tip.style.left = Math.min(W - 190, ev.clientX - rect.left + 14) + "px";
    tip.style.top = (ev.clientY - rect.top - 10) + "px";
    const evLab = edgeEventLabel(evMap[b.date]);
    let flagLab = "";
    if (family === "high_flag" && flag.pattern === "high_flag") {
      if (flag.pole_index === i) flagLab = "Pole 放量突破";
      else if (flag.handle_start != null && i >= flag.handle_start && i <= flag.handle_end) flagLab = "旗面整理";
      if (flag.flag_stage === "secondary_buy" && i === n - 1) flagLab = "二次买点";
    }
    if (family === "trendline") {
      if (tln.tl_event_bar === b.date) flagLab = tlEventLabel(tln.tl_event) || flagLab;
      else if (tln.tl_support && tln.tl_support.date1 === b.date) flagLab = "支撑锚点";
      else if (tln.tl_support && tln.tl_support.date2 === b.date) flagLab = "支撑锚点";
      else if (tln.tl_resistance && tln.tl_resistance.date1 === b.date) flagLab = "压力锚点";
      else if (tln.tl_resistance && tln.tl_resistance.date2 === b.date) flagLab = "压力锚点";
    }
    const extra = flagLab || evLab;
    tip.innerHTML = `<b>${b.date}</b><br>开 ${priceFmt(b.open)} · 高 ${priceFmt(b.high)}<br>` +
      `低 ${priceFmt(b.low)} · 收 <b>${priceFmt(b.close)}</b> · 量 ${(b.vol / 10000).toFixed(1)}万` +
      (extra ? `<br>${extra}` : "");
  };
  cv.onmouseleave = () => { tip.style.display = "none"; };
}

/* =============================== 行情自动刷新（3s） =============================== */
async function refreshQuotes() {
  if (!S.loaded) return;
  const data = S.market === "crypto" ? (S.crypto || {}) : (S.watch || {});
  const rows = data.candidates || [];
  const codes = rows.filter(r => r.qualified).map(r => r.code);
  if (!codes.length || S.market === "crypto") return;  // 币圈价格在扫描时已定格，3s 刷新仅 A股
  try {
    const qs = await jfetch("api/quotes?codes=" + codes.join(","));
    codes.forEach(code => {
      const q = qs[code];
      if (!q) return;
      const row = rows.find(r => r.code === code);
      if (row) { row.price = q.price; row.chg = q.chg; }
      const card = document.querySelector(`.sig[data-code="${code}"]`);
      if (!card) return;
      const px = card.querySelector("[data-px]");
      const chg = card.querySelector("[data-chg]");
      if (px) px.textContent = fmt2(q.price);
      if (chg) { chg.textContent = sign(q.chg) + "%"; chg.className = "chg " + clsOf(q.chg); }
    });
  } catch (e) {}
}

/* =============================== 扫描 / 配置 =============================== */
let localScanWait = false;
let scanPollTimer = null;
let scanWasRunning = false;
function scanBtnLabel() {
  return S.market === "crypto" ? "全市场标的扫描" : "全市场扫描";
}
function scanModeLabel(mode) {
  return { market: "全市场扫描", quick: "全市场快扫", crypto: "全市场标的扫描", pool: "自选池扫描" }[mode] || "扫描";
}
function isScanRunning(st) {
  if (!st) return false;
  const sp = st.scan_progress || {};
  return !!(st.scanning || sp.running);
}
function renderScanProgress(st) {
  const bar = $("scanProgress");
  if (!bar) return;
  const sp = (st && st.scan_progress) || {};
  const running = isScanRunning(st);
  if (!running && !localScanWait) {
    bar.hidden = true;
    bar.classList.remove("indeterminate");
    $("btnScan").disabled = false;
    $("btnForceScan").disabled = false;
    $("btnScan").textContent = scanBtnLabel();
    return;
  }
  bar.hidden = false;
  const pct = Number(sp.pct || 0);
  const total = Number(sp.total || 0);
  const done = Number(sp.done || 0);
  $("scanProgressTitle").textContent = scanModeLabel(sp.mode) + (running ? "进行中" : "");
  $("scanProgressPct").textContent = total > 0 ? (Math.round(pct * 10) / 10) + "%" : "…";
  $("scanProgressMsg").textContent = sp.message || (running ? "扫描中…" : "");
  $("scanProgressCount").textContent = total > 0 ? (done + " / " + total) : "";
  const fill = $("scanProgressFill");
  if (running && total <= 0) {
    bar.classList.add("indeterminate");
    fill.style.width = "32%";
  } else {
    bar.classList.remove("indeterminate");
    fill.style.width = Math.max(0, Math.min(100, pct)) + "%";
  }
  $("btnScan").disabled = true;
  $("btnForceScan").disabled = true;
  $("btnScan").textContent = "扫描中…";
}
function ensureScanPoll() {
  const need = localScanWait || isScanRunning(S.status);
  if (need && !scanPollTimer) {
    scanPollTimer = setInterval(tickScanStatus, 1000);
  } else if (!need && scanPollTimer) {
    clearInterval(scanPollTimer);
    scanPollTimer = null;
  }
}
async function tickScanStatus() {
  try {
    const st = await jfetch("api/status");
    const was = scanWasRunning || isScanRunning(S.status) || localScanWait;
    S.status = st;
    const nowRun = isScanRunning(st);
    scanWasRunning = nowRun;
    renderScanProgress(st);
    if (was && !nowRun) {
      localScanWait = false;
      await refresh();
      toast("扫描完成");
      renderScanProgress(S.status);
    }
    ensureScanPoll();
  } catch (e) {}
}
async function doScan(force) {
  if (localScanWait) {
    ensureScanPoll();
    return;
  }
  localScanWait = true;
  renderScanProgress(S.status || { scanning: true, scan_progress: { running: true, message: "正在请求扫描…" } });
  ensureScanPoll();
  try {
    const r = await jfetch("api/scan" + (force ? "?force=1" : ""), {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mode: S.market === "crypto" ? "crypto" : "market", force: !!force })
    });
    if (r.status === "running") {
      S.status = {
        scanning: true,
        scan_progress: r.scan_progress || (S.status && S.status.scan_progress),
        scan_log: r.scan_log
      };
      renderScanProgress(S.status);
      toast("已加入当前扫描");
      ensureScanPoll();
    } else if (r.from_cache || r.status === "cached") {
      localScanWait = false;
      if (S.market === "crypto") S.crypto = r; else S.watch = r;
      renderAll();
      toast("缓存 · 1小时内未重复全量扫描");
      ensureScanPoll();
    } else {
      S.status = { scanning: true, scan_progress: r.scan_progress || { running: true, mode: S.market === "crypto" ? "crypto" : "market" } };
      scanWasRunning = true;
      renderScanProgress(S.status);
      ensureScanPoll();
    }
  } catch (e) {
    localScanWait = false;
    toast("扫描失败");
    renderScanProgress(S.status);
    ensureScanPoll();
  }
}

async function saveCfg() {
  try {
    const r = await jfetch("api/config", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ auto: $("autoCb").checked }) });
    S.cfg = r.config;
    toast("已保存");
  } catch (e) { toast("保存失败"); }
}

const BOX_MODE_TOAST = {
  classic: "箱体模式：经典（窗口最高/最低）。K 线立即按此绘制；评分需强制重扫后更新",
  p0: "箱体模式：P0 增强（分位数 + 振幅门控）。K 线立即按此绘制；评分需强制重扫后更新",
  p1: "箱体模式：P1 通道（OLS 斜向通道）。K 线立即按此绘制；评分需强制重扫后更新",
};

async function setBoxMode(mode) {
  if (mode !== "classic" && mode !== "p0" && mode !== "p1") return;
  if (currentFamily() !== "box") return;
  const prev = (S.cfg && S.cfg.box_mode) || "classic";
  if (prev === mode) return;
  try {
    const r = await jfetch("api/config", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ box_mode: mode }) });
    S.cfg = r.config;
    S.kbars = {};
    resetKlineQueue();
    renderAll();
    toast(BOX_MODE_TOAST[mode] || "箱体模式已切换");
  } catch (e) { toast("模式保存失败"); }
}

const FAMILY_TOAST = {
  box: "形态：箱体/通道。K 线按箱体绘制；评分需强制重扫后更新",
  high_flag: "形态：高位旗形(杯柄)。请强制重扫以批量筛选旗面/二次买点",
  trendline: "形态：趋势线。请强制重扫以筛选支撑/压力与刚跌破、刚突破",
};

async function setPatternFamily(fam) {
  if (fam !== "box" && fam !== "high_flag" && fam !== "trendline") return;
  const prev = currentFamily();
  if (prev === fam) return;
  try {
    const r = await jfetch("api/config", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ pattern_family: fam }) });
    S.cfg = r.config;
    S.kbars = {};
    resetKlineQueue();
    renderAll();
    toast(FAMILY_TOAST[fam] || "形态已切换");
  } catch (e) { toast("形态保存失败"); }
}

async function setCryptoInterval(iv) {
  if (iv !== "4h" && iv !== "8h" && iv !== "1d") return;
  const prev = currentInterval();
  if (prev === iv) return;
  try {
    const r = await jfetch("api/config", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ crypto_interval: iv }) });
    S.cfg = r.config;
    S.kbars = {};
    resetKlineQueue();
    renderAll();
    toast("K线周期：" + intervalLabel(iv) + "。币/金/股票代币用 Gate 原生周期；无代币美股用新浪分钟K；日韩正股用日K。请强制重扫");
  } catch (e) { toast("周期保存失败"); }
}

function setPoolFilter(flt) {
  if (flt !== "all" && flt !== "crypto" && flt !== "us_stock" && flt !== "gold_index"
      && flt !== "jp" && flt !== "kr") return;
  if (S.poolFilter === flt) return;
  S.poolFilter = flt;
  renderAll();
}

function setFlagFilter(flt) {
  if (flt !== "all" && flt !== "handle" && flt !== "secondary_buy") return;
  if (S.flagFilter === flt) return;
  S.flagFilter = flt;
  renderAll();
}

function setTlFilter(flt) {
  if (flt !== "all" && flt !== "support_break" && flt !== "resistance_break") return;
  if (S.tlFilter === flt) return;
  S.tlFilter = flt;
  renderAll();
}

function switchMarket(market) {
  if (S.market === market) return;
  S.market = market;
  S.kbars = {};
  resetKlineQueue();
  if (market === "crypto") S.selBoard = null;   // 板块筛选仅 A股
  $("btnScan").textContent = scanBtnLabel();
  renderAll();
}

function openCoverModal() {
  const ov = S.override || {};
  $("coverSymbols").value = (ov.symbols || []).join("\n");
  $("coverErr").textContent = "";
  $("coverModal").hidden = false;
  setTimeout(() => $("coverSymbols").focus(), 30);
}
function closeCoverModal() {
  $("coverModal").hidden = true;
}
async function saveCoverPool() {
  const text = $("coverSymbols").value;
  $("coverErr").textContent = "";
  try {
    const r = await jfetch("api/global_pool/override", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ symbols: text })
    });
    S.override = r;
    const nRej = (r.rejected || []).length;
    if (nRej) {
      $("coverErr").textContent = (r.rejected || []).map(x => x.code + "：" + x.reason).join("\n");
    }
    renderAll();
    if (r.mode === "override") {
      toast("覆盖池 " + r.count + " 只" + (nRej ? "（已拒绝无效项）" : "") + "。请强制重扫");
    } else {
      toast(nRej ? "有效项为空，已回默认池" : "已恢复默认混合池。请强制重扫");
    }
    if (!nRej) closeCoverModal();
  } catch (e) { toast("覆盖池保存失败"); }
}
async function clearCoverPool() {
  try {
    const r = await jfetch("api/global_pool/override", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "clear" })
    });
    S.override = r;
    $("coverSymbols").value = "";
    $("coverErr").textContent = "";
    renderAll();
    closeCoverModal();
    toast("已清空覆盖，使用默认混合池。请强制重扫");
  } catch (e) { toast("清空失败"); }
}

/* =============================== 启动 =============================== */
function boot() {
  if (location.protocol === "file:") {
    $("cards").innerHTML = `<div class="empty"><div class="big">OFFLINE</div><p>python3 server.py → http://127.0.0.1:8808</p></div>`;
    return;
  }
  document.querySelectorAll("#marketTabs .tab").forEach(t => {
    t.addEventListener("click", () => switchMarket(t.dataset.market));
  });
  // 热门板块点击筛选
  $("hotTopics").addEventListener("click", e => {
    const chip = e.target.closest(".hot-chip[data-board]");
    if (!chip) return;
    const board = chip.dataset.board;
    S.selBoard = (S.selBoard === board) ? null : board;
    renderAll();
  });
  $("btnScan").addEventListener("click", () => doScan(false));
  $("btnForceScan").addEventListener("click", () => doScan(true));
  $("autoCb").addEventListener("change", () => saveCfg());
  document.querySelectorAll("#boxModeTabs .tab").forEach(t => {
    t.addEventListener("click", () => setBoxMode(t.dataset.boxMode));
  });
  document.querySelectorAll("#familyTabs .tab").forEach(t => {
    t.addEventListener("click", () => setPatternFamily(t.dataset.family));
  });
  document.querySelectorAll("#flagFilterTabs .tab").forEach(t => {
    t.addEventListener("click", () => setFlagFilter(t.dataset.flagFilter));
  });
  document.querySelectorAll("#tlFilterTabs .tab").forEach(t => {
    t.addEventListener("click", () => setTlFilter(t.dataset.tlFilter));
  });
  document.querySelectorAll("#cryptoIntervalTabs .tab").forEach(t => {
    t.addEventListener("click", () => setCryptoInterval(t.dataset.interval));
  });
  document.querySelectorAll("#poolFilterTabs .tab").forEach(t => {
    t.addEventListener("click", () => setPoolFilter(t.dataset.poolFilter));
  });
  $("hpCoverWrap").addEventListener("click", openCoverModal);
  $("hpCoverWrap").addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openCoverModal(); }
  });
  $("btnCoverCancel").addEventListener("click", closeCoverModal);
  $("btnCoverSave").addEventListener("click", saveCoverPool);
  $("btnCoverClear").addEventListener("click", clearCoverPool);
  $("coverModal").addEventListener("click", e => {
    if (e.target === $("coverModal")) closeCoverModal();
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && !$("coverModal").hidden) closeCoverModal();
  });
  refresh().then(() => {
    refreshQuotes();
    if (isScanRunning(S.status)) {
      scanWasRunning = true;
      renderScanProgress(S.status);
      ensureScanPoll();
    }
  });
  setInterval(refreshQuotes, 3000);
  setInterval(() => {
    if (!localScanWait && !isScanRunning(S.status)) refresh().catch(() => {});
  }, 300000);
}
boot();
</script>
